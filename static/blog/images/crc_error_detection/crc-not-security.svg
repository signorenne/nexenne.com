<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:867px;height:231px;background:#FFFFFF;" width="867px" height="231px" viewBox="0 0 867 231" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7beta6?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="236.549" y="22.995" fill="#000" font-size="14" textLength="387.611" font-weight="700">CRC is integrity for accidents, not authentication</text></g><!--entity ERR--><g class="entity" data-qualified-name="ERR" id="ent0001" data-source-line="7"><rect x="14.25" y="44.297" width="146.157" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="24.25" y="67.292" fill="#000" font-size="14" textLength="112.089">Accidental error</text><text x="24.25" y="83.589" fill="#000" font-size="14" textLength="119.055">noise, bad cable,</text><text x="24.25" y="99.886" fill="#000" font-size="14" textLength="126.157">corrupted storage</text></g><!--entity CRC--><g class="entity" data-qualified-name="CRC" id="ent0002" data-source-line="8"><rect x="433.65" y="56.447" width="194.651" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="443.65" y="79.442" fill="#000" font-size="14" textLength="74.717">CRC check</text><text x="443.65" y="95.739" fill="#000" font-size="14" textLength="174.651">recalculate and compare</text></g><!--entity DET--><g class="entity" data-qualified-name="DET" id="ent0003" data-source-line="9"><rect x="689.3" y="56.447" width="164.409" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="699.3" y="79.442" fill="#000" font-size="14" textLength="123.484">Detect corruption</text><text x="699.3" y="95.739" fill="#000" font-size="14" textLength="144.409">then discard or retry</text></g><!--entity ATT--><g class="entity" data-qualified-name="ATT" id="ent0004" data-source-line="11"><rect x="7" y="148.297" width="160.649" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="171.292" fill="#000" font-size="14" textLength="138.024">Intentional attacker</text><text x="17" y="187.589" fill="#000" font-size="14" textLength="137.915">can modify payload</text><text x="17" y="203.886" fill="#000" font-size="14" textLength="140.649">and recompute CRC</text></g><!--entity SEC--><g class="entity" data-qualified-name="SEC" id="ent0005" data-source-line="12"><rect x="459.28" y="148.297" width="143.389" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="469.28" y="171.292" fill="#000" font-size="14" textLength="95.744">Security tools</text><text x="469.28" y="187.589" fill="#000" font-size="14" textLength="121.563">HMAC, signature,</text><text x="469.28" y="203.886" fill="#000" font-size="14" textLength="123.389">TLS or encryption</text></g><!--link ERR to CRC--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="14" data-link-type="dependency"><path d="M160.76,79.397 C235.15,80.067 346.37,81.082 428.51,81.822" style="stroke:#181818;stroke-width:1;" fill="none" id="ERR-to-CRC"/><polygon points="433.51,81.867,424.546,77.786,428.51,81.822,424.474,85.786,433.51,81.867" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link CRC to DET--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="15" data-link-type="dependency"><path d="M628.65,82.737 C648.67,82.737 664.57,82.737 683.98,82.737" style="stroke:#181818;stroke-width:1;" fill="none" id="CRC-to-DET"/><polygon points="688.98,82.737,679.98,78.737,683.98,82.737,679.98,86.737,688.98,82.737" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link ATT to CRC--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" id="lnk8" data-source-line="16" data-link-type="dependency"><path d="M168.05,164.687 C242.59,147.817 349.153,123.681 428.673,105.681" style="stroke:#181818;stroke-width:1;" fill="none" id="ATT-to-CRC"/><polygon points="433.55,104.577,423.889,102.663,428.673,105.681,425.655,110.465,433.55,104.577" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="258.65" y="108.804" fill="#000" font-size="13" textLength="84.087">can still pass</text></g><!--link ATT to SEC--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-source-line="17" data-link-type="dependency"><path d="M168.05,182.737 C250.91,182.737 374.38,182.737 453.89,182.737" style="stroke:#181818;stroke-width:1;" fill="none" id="ATT-to-SEC"/><polygon points="458.89,182.737,449.89,178.737,453.89,182.737,449.89,186.737,458.89,182.737" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="198.65" y="178.804" fill="#000" font-size="13" textLength="204.521">needs cryptographic protection</text></g><?plantuml-src LP51Zjim34NtFWKnwym5kYWGU0AqGBj9ilI68p4s4OKqA1e3txwKPbgaEqdK_tpyTFP2C9v7u0eiJhEnxt1J0qo9CudN0uWwuEPBt3YXiyfGxomh6ZxW7TDzDjqaZrf2zx6mqrEzBfZrWsM66vPAmr3evk0AnlFYaDaeTSkX7L3c07evVZN70cIcDeaeLpf4jmm9tmiT9abgjgrE6QghuKmlW1LEv_EpKvijBPJkayGhbhGLT0AKyD5787wgujkpweqyBl3L8UWcQUC7RKre6M9E8xUzQzzEr__WVqQEqaH1Z-wH3yK02GKUclcsmufxKSoJD8eG1iVcVGtTxtYzFjjTA6rzAwvQwYG_VX_70rIU1Nsp5iJrrwKHaIJREsstkPp6OOWquFNrUv-lHT7EZJTw_7s7Rz3OgdCfWLRhls8uH568SeLkhRFXkd22rTG_r_O7?></g></svg>