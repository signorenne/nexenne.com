.0829" x="306.0669" y="364.1852">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.4529" x="477.5758" y="364.1852">no</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="164.673" x="230.8132" y="389.4081"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="144.673" x="240.8132" y="412.2362">remove USB presentation</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="154.653" x="235.8233" y="460.7523"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="134.653" x="245.8233" y="483.5804">keep the previous route</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="117.4527" x="428.8495" y="389.4081"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="97.4527" x="438.8495" y="412.2362">continue probing</text><polygon fill="#F1F1F1" points="400.3628,503.0964,412.3628,515.0964,400.3628,527.0964,388.3628,515.0964,400.3628,503.0964" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="253.1347,540.4405,265.1347,552.4405,253.1347,564.4405,241.1347,552.4405,253.1347,540.4405" style="stroke:#181818;stroke-width:0.5;"/><ellipse cx="253.1347" cy="595.4405" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="253.1347" cy="595.4405" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="253.1347" x2="253.1347" y1="70.0679" y2="90.0679"/><polygon fill="#181818" points="249.1347,80.0679,253.1347,90.0679,257.1347,80.0679,253.1347,84.0679" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="253.1347" x2="253.1347" y1="126.412" y2="146.412"/><polygon fill="#181818" points="