<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="539px" preserveAspectRatio="none" style="width:887px;height:539px;background:#FFFFFF;" version="1.1" viewBox="0 0 887 539" width="887px" zoomAndPan="magnify"><defs/><g><ellipse cx="304.5813" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="236.6403,50,372.5223,50,384.5223,64.9819,372.5223,79.9638,236.6403,79.9638,224.6403,64.9819,236.6403,50" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="135.882" x="236.6403" y="61.7589">Does the component have</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="110.6812" x="236.6403" y="76.7408">an internal oscillator?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.0829" x="207.5574" y="61.7589">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.4529" x="384.5223" y="61.7589">no</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="187.4252" x="11" y="89.9638"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="167.4252" x="21" y="112.7919">Use GPIO to turn it on and off</text><polygon fill="#F1F1F1" points="445.4904,89.9638,563.4096,89.9638,575.4096,104.9457,563.4096,119.9276,445.4904,119.9276,433.4904,104.9457,445.4904,89.9638" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="117.9191" x="445.4904" y="101.7227">Are monophonic tones</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="116.1482" x="445.4904" y="116.7046">and sweeps sufficient?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.0829" x="416.4076" y="101.7227">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.4529" x="575.4096" y="101.7227">no</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="236.6496" x="228.4252" y="129.9276"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="216.6496" x="238.4252" y="152.7556">Use LEDC for frequency and duty cycle</text><rect fill="#F1F1F1" height="52.6882" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="145.9769" x="273.7615" y="256.7264"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="120.5529" x="283.7615" y="279.5545">Add a dedicated task,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="125.9769" x="283.7615" y="295.8986">GPTimer, or esp_timer</text><polygon fill="#F1F1F1" points="292.3609,201.2717,401.1391,201.2717,413.1391,216.2536,401.1391,231.2354,292.3609,231.2354,280.3609,216.2536,292.3609,201.2717" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.0829" x="350.75" y="242.9944">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="106.8972" x="292.3609" y="213.0306">Do note events need</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="108.7782" x="292.3609" y="228.0125">more precise timing?</text><polygon fill="#F1F1F1" points="346.75,329.4146,358.75,341.4146,346.75,353.4146,334.75,341.4146,346.75,329.4146" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="571.9011,129.9276,752.3989,129.9276,764.3989,141.9276,752.3989,153.9276,571.9011,153.9276,559.9011,141.9276,571.9011,129.9276" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="180.4977" x="571.9011" y="146.1955">Is simple sampled audio sufficient?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.0829" x="542.8182" y="138.7046">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.4529" x="764.3989" y="138.7046">no</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="109.6527" x="495.0748" y="163.9276"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.6527" x="505.0748" y="186.7556">Use PWM Audio</text><rect fill="#F1F1F1" height="52.6882" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="204.1533" x="672.3222" y="163.9276"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="184.1533" x="682.3222" y="186.7556">Use I2S with a codec or amplifier</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="144.169" x="682.3222" y="203.0998">for voice and richer audio</text><polygon fill="#F1F1F1" points="662.15,222.6158,674.15,234.6158,662.15,246.6158,650.15,234.6158,662.15,222.6158" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="504.45,359.4146,516.45,371.4146,504.45,383.4146,492.45,371.4146,504.45,359.4146" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="304.5813,389.4146,316.5813,401.4146,304.5813,413.4146,292.5813,401.4146,304.5813,389.4146" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="52.6882" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="189.0212" x="210.0707" y="433.4146"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="169.0212" x="220.0707" y="456.2427">Always verify voltage, current,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="108.6608" x="220.0707" y="472.5868">and the drive stage</text><ellipse cx="304.5813" cy="517.1028" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="304.5813" cy="517.1028" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="346.75" x2="346.75" y1="231.2354" y2="256.7264"/><polygon fill="#181818" points="342.75,246.7264,346.75,256.7264,350.75,246.7264,346.75,250.7264" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="413.1391" x2="429.7385" y1="216.2536" y2="216.2536"/><polygon fill="#181818" points="425.7385,271.5796,429.7385,281.5796,433.7385,271.5796,429.7385,275.5796" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="429.7385" x2="429.7385" y1="216.2536" y2="341.4146"/><line style="stroke:#181818;stroke-width:1;" x1="429.7385" x2="358.75" y1="341.4146" y2="341.4146"/><polygon fill="#181818" points="368.75,337.4146,358.75,341.4146,368.75,345.4146,364.75,341.4146" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="346.75" x2="346.75" y1="309.4146" y2="329.4146"/><polygon fill="#181818" points="342.75,319.4146,346.75,329.4146,350.75,319.4146,346.75,323.4146" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="346.75" x2="346.75" y1="166.2717" y2="201.2717"/><polygon fill="#181818" points="342.75,191.2717,346.75,201.2717,350.75,191.2717,346.75,195.2717" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="559.9011" x2="549.9011" y1="141.9276" y2="141.9276"/><line style="stroke:#181818;stroke-width:1;" x1="549.9011" x2="549.9011" y1="141.9276" y2="163.9276"/><polygon fill="#181818" points