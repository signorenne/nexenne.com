<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="646px" preserveAspectRatio="none" style="width:365px;height:646px;background:#FFFFFF;" version="1.1" viewBox="0 0 365 646" width="365px" zoomAndPan="magnify"><defs/><g><ellipse cx="175.002" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="52.6882" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="199.1133" x="75.4453" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="179.1133" x="85.4453" y="72.8281">Read the note, duration in ticks,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="98.5687" x="85.4453" y="89.1722">and gate_percent</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="220.3174" x="64.8432" y="122.6882"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="200.3174" x="74.8432" y="145.5163">Convert the ticks into total duration</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="257.5297" x="46.2371" y="179.0323"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="237.5297" x="56.2371" y="201.8604">sound_ms = duration &#215; gate_percent / 100</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="193.4132" x="78.2953" y="235.3765"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="173.4132" x="88.2953" y="258.2045">rest_ms = duration - sound_ms</text><polygon fill="#F1F1F1" points="126.4483,291.7206,223.5556,291.7206,235.5556,303.7206,223.5556,315.7206,126.4483,315.7206,114.4483,303.7206,126.4483,291.7206" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="97.1073" x="126.4483" y="307.9885">Is the event a rest?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.0829" x="97.3654" y="300.4976">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.4529" x="235.5556" y="300.4976">no</text><rect fill="#F1F1F1" height="52.6882" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="146.1449" x="11" y="325.7206"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="76.6805" x="21" y="348.5487">Keep duty = 0</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.1449" x="21" y="364.8928">for the entire duration</text><rect fill="#F1F1F1" height="52.6882" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="145.8449" x="193.009" y="325.7206"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="125.8449" x="203.009" y="348.5487">Convert the MIDI note</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="81.2766" x="203.009" y="364.8928">to a frequency</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="177.5731" x="177.1449" y="398.4088"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.5731" x="187.1449" y="421.2369">Start the tone for sound_ms</text><rect fill="#F1F1F1" height="52.6882" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="86.0245" x="222.9193" y="454.7529"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="66.0245" x="232.9193" y="477.581">Set duty = 0</text><text fill="#000000" font-family="sans-serif"