ies later</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="210.9219" x="213.002" y="343.7813"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="190.9219" x="223.002" y="364.9199">Both nodes continue arbitration</text><polygon fill="#F1F1F1" points="211.4819,519.625,223.4819,531.625,211.4819,543.625,199.4819,531.625,211.4819,519.625" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="180.3945" x="121.2847" y="563.625"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.3945" x="131.2847" y="584.7637">Node A keeps transmitting</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="207.7813" x="107.5913" y="617.5938"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="187.7813" x="117.5913" y="638.7324">Winning frame is not corrupted</text><ellipse cx="211.4819" cy="682.5625" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="211.4819" cy="682.5625" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="211.4819" x2="211.4819" y1="72.2969" y2="92.2969"/><polygon fill="#181818" points="207.4819,82.2969,211.4819,92.2969,215.4819,82.2969,211.4819,86.2969" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="211.4819" x2="211.4819" y1="126.2656" y2="146.2656"/><polygon fill="#181818" points="207.4819,136.2656,211.4819,146.2656,215.4819,136.2656,211.4819,140.2656" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="211.4819" x2="211.