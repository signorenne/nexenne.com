<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="400px" preserveAspectRatio="none" style="width:416px;height:400px;background:#FFFFFF;" version="1.1" viewBox="0 0 416 400" width="416px" zoomAndPan="magnify"><title>Re-entrancy deadlock: both sides wait for the other</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="358.5527" x="35.7583" y="29.9659">Re-entrancy deadlock: both sides wait for the other</text><g><title>PC</title><rect fill="#FFFFFF" height="169.5301" style="stroke:#181818;stroke-width:1;" width="10" x="38.659" y="112.8419"/></g><g><title>MCU</title><rect fill="#FFFFFF" height="169.5301" style="stroke:#181818;stroke-width:1;" width="10" x="255.9981" y="112.8419"/></g><g><title>PC</title><rect fill="#000000" fill-opacity="0.00000" height="283.6481" width="8" x="39.659" y="79.1358"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="43" x2="43" y1="79.1358" y2="362.784"/></g><g><title>MCU</title><rect fill="#000000" fill-opacity="0.00000" height="283.6481" width="8" x="256.9981" y="79.1358"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="260.1082" x2="260.1082" y1="79.1358" y2="362.784"/></g><g class="participant participant-head" data-participant="PC"><rect fill="#E2E2F0" height="33.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="31.3179" x="28" y="45.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="17.3179" x="35" y="67.0339">PC</text></g><g class="participant participant-tail" data-participant="PC"><rect fill="#E2E2F0" height="33.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="31.3179" x="28" y="361.784"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="17.3179" x="35" y="383.7499">PC</text></g><g class="participant participant-head" data-participant="MCU"><rect fill="#E2E2F0" height="33.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="45.7799" x="238.1082" y="45.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="31.7799" x="245.1082" y="67.0339">MCU</text></g><g class="participant participant-tail" data-participant="MCU"><rect fill="#E2E2F0" height="33.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="45.7799" x="238.1082" y="361.784"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="31.7799" x="245.1082" y="383.7499">MCU</text></g><g><title>PC</title><rect fill="#FFFFFF" height="169.5301" style="stroke:#181818;stroke-width:1;" width="10" x="38.659" y="112.8419"/></g><g><title>MCU</title><rect fill="#FFFFFF" height="169.5301" style="stroke:#181818;stroke-width:1;" width="10" x="255.9981" y="112.8419"/></g><g class="message" data-participant-1="PC" data-participant-2="MCU"><polygon fill="#181818" points="243.9981,108.8419,253.9981,112.8419,243.9981,116.8419,247.9981,112.8419" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="48.659" x2="249.9981" y1="112.8419" y2="112.8419"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.2531" x="55.659" y="107.0328">request start_calibration</text></g><g class="message" data-participant-1="PC" data-participant-2="PC"><line style="stroke:#181818;stroke-width:1;" x1="48.659" x2="90.659" y1="144.5479" y2="144.5479"/><line style="stroke:#181818;stroke-width:1;" x1="90.659" x2="90.659" y1="144.5479" y2="157.5479"/><line style="stroke:#181818;stroke-width:1;" x1="49.659" x2="90.659" y1="157.5479" y2="157.5479"/><polygon fill="#181818" points="59.659,153.5479,49.659,157.5479,59.659,161.5479,55.659,157.5479" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.0711" x="55.659" y="138.7389">waits for the response</text></g><g class="message" data-participant-1="MCU" data-participant-2="PC"><polygon fill="#181818" points="59.659,185.2539,49.659,189.2539,59.659,193.2539,55.659,189.2539" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="53.659" x2="254.9981" y1="189.2539" y2="189.2539"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.3392" x="65.659" y="183.4449">request confirm_user_present</text></g><path d="M53,202.2539 L53,247.2539 L275,247.2539 L275,212.2539 L265,202.2539 L53,202.2539" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M265,202.2539 L265,212.2539 L275,212.2539 L265,202.2539" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.9942" x="59" y="221.1509">Nobody reads this: the PC thread</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.1422" x="59" y="238.8569">is blocked on the first response.</text><g class="message" data-participant-1="MCU" data-participant-2="MCU"><line style="stroke:#181818;stroke-width:1;" x1="265.9981" x2="307.9981" y1="281.3719" y2="281.3719"/><line style="stroke:#181818;stroke-width:1;" x1="307.9981" x2="307.9981" y1="281.3719" y2="294.3719"/><line style="stroke:#181818;stroke-width:1;" x1="260.9981" x2="307.9981" y1="294.3719" y2="294.3719"/><polygon fill="#181818" points="270.9981,290.3719,260.9981,294.3719,270.9981,298.3719,266.9981,294.3719" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.0711" x="272.9981" y="275.5629">waits for the response</text></g><path d="M5,302.3719 L5,347.3719 L300,347.3719 L300,312.3719 L290,302.3719 L5,302.3719" fill="#FFDDDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M290,302.3719 L290,312.3719 L300,312.3719 L290,302.3719" fill="#FFDDDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.9893" x="11" y="321.2689">Both ends are blocked. A handler must never</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.4032" x="11" y="338.975">wait on a call it issued itself.</text><!--SRC=[TP71JiCm38RlUGfhNDaUe0SaADeDL25ndjp6fH5TKc9tQ6_FdquTuq0FRUp-_ltPiM2Zq9ji9Lhcs9t92_inTPyLjSa6qk15wPk3KPyosI24j6Jd9iuMkZ1nDDeqzOPOgQd_fb_gzoMFhtDDJTk7SgIAidpDeaPga1yw7aERsKAAZZiB9pOfNjTpgR-KurqjE7hboQ9JYYgkMA-IjK6NOX_oyJ2hvCC4AGPrCS4pXu_1AFMb4T5hQfC_euozmZLejNZ3ouQIX2GejMKpuYd5vI-SqMBjltCIFHNlbUGowp-qMFJjU3SXW2w8wIGPqVrYTBVVF-C1o5Ev6FHIuYmhquuUQU3eHvGSPs15GJNKozq1c0bh7Wb1K9qn1AXax7-fVm00]--></g></svg>