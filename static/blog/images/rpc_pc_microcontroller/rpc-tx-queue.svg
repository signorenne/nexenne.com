<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="385px" preserveAspectRatio="none" style="width:513px;height:385px;background:#FFFFFF;" version="1.1" viewBox="0 0 513 385" width="513px" zoomAndPan="magnify"><title>One transmit queue, so frames never interleave</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="335.0748" x="82.1482" y="24.9659">One transmit queue, so frames never interleave</text><!--entity A--><g class="entity" data-entity="A" data-source-line="3" data-uid="ent0002" id="entity_A"><rect fill="#F1F1F1" height="39.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="83.6438" x="7" y="47.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.6438" x="17" y="72.0339">handler A</text></g><!--entity B--><g class="entity" data-entity="B" data-source-line="4" data-uid="ent0003" id="entity_B"><rect fill="#F1F1F1" height="39.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="83.7977" x="125.92" y="47.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.7977" x="135.92" y="72.0339">handler B</text></g><!--entity E--><g class="entity" data-entity="E" data-source-line="5" data-uid="ent0004" id="entity_E"><rect fill="#F1F1F1" height="39.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="104.4757" x="244.58" y="47.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.4757" x="254.58" y="72.0339">event source</text></g><!--entity T--><g class="entity" data-entity="T" data-source-line="6" data-uid="ent0005" id="entity_T"><rect fill="#F1F1F1" height="39.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="102.5577" x="384.54" y="47.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.5577" x="394.54" y="72.0339">timeout task</text></g><!--entity Q--><g class="entity" data-entity="Q" data-source-line="7" data-uid="ent0006" id="entity_Q"><path d="M196.16,146.1379 L267.4937,146.1379 C272.4937,146.1379 272.4937,160.6719 272.4937,160.6719 C272.4937,160.6719 272.4937,175.2058 267.4937,175.2058 L196.16,175.2058 C191.16,175.2058 191.16,160.6719 191.16,160.6719 C191.16,160.6719 191.16,146.1379 196.16,146.1379" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M267.4937,146.1379 C262.4937,146.1379 262.4937,160.6719 262.4937,160.6719 C262.4937,175.2058 267.4937,175.2058 267.4937,175.2058" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.3337" x="196.16" y="166.1039">TX queue</text></g><!--entity Enc--><g class="entity" data-entity="Enc" data-source-line="8" data-uid="ent0007" id="entity_Enc"><rect fill="#F1F1F1" height="39.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="74.0258" x="79.81" y="238.3779"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="54.0258" x="89.81" y="263.3439">encoder</text></g><!--entity W--><g class="entity" data-entity="W" data-source-line="9" data-uid="ent0008" id="entity_W"><rect fill="#F1F1F1" height="39.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="127.4636" x="53.09" y="340.6179"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.4636" x="63.09" y="365.5839">transport.write()</text></g><g class="entity" data-entity="GMN15" data-source-line="19" data-uid="ent0016" id="entity_GMN15"><path d="M189.27,235.2079 L189.27,280.6199 A0,0 0 0 0 189.27,280.6199 L506.3712,280.6199 A0,0 0 0 0 506.3712,280.6199 L506.3712,245.2079 L496.3712,235.2079 L324.93,235.2079 L248.44,175.3179 L316.93,235.2079 L