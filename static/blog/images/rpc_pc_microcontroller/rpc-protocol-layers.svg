<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="710px" preserveAspectRatio="none" style="width:530px;height:710px;background:#FFFFFF;" version="1.1" viewBox="0 0 530 710" width="530px" zoomAndPan="magnify"><title>A deliberately simple layer stack for a first protocol</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="358.2306" x="79.3433" y="24.9659">A deliberately simple layer stack for a first protocol</text><!--entity L1--><g class="entity" data-entity="L1" data-source-line="3" data-uid="ent0002" id="entity_L1"><rect fill="#F1F1F1" height="39.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="155.1555" x="54.24" y="47.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.1555" x="64.24" y="72.0339">Application handlers</text></g><!--entity L2--><g class="entity" data-entity="L2" data-source-line="4" data-uid="ent0003" id="entity_L2"><rect fill="#F1F1F1" height="39.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="233.7232" x="14.96" y="146.1379"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="213.7232" x="24.96" y="171.1039">Request / notification dispatcher</text></g><!--entity L3--><g class="entity" data-entity="L3" data-source-line="5" data-uid="ent0004" id="entity_L3"><rect fill="#F1F1F1" height="39.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="192.9833" x="35.33" y="257.2379"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.9833" x="45.33" y="282.2039">Pending-request manager</text></g><!--entity L4--><g class="entity" data-entity="L4" data-source-line="6" data-uid="ent0005" id="entity_L4"><rect fill="#F1F1F1" height="39.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="140.3855" x="61.63" y="368.3279"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="120.3855" x="71.63" y="393.2939">Encoder / decoder</text></g><!--entity L5--><g class="entity" data-entity="L5" data-source-line="7" data-uid="ent0006" id="entity_L5"><rect fill="#F1F1F1" height="39.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="171.7034" x="45.97" y="467.3979"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151.7034" x="55.97" y="492.3639">Framing and validation</text></g><!--entity L6--><g class="entity" data-entity="L6" data-source-line="8" data-uid="ent0007" id="entity_L6"><rect fill="#F1F1F1" height="39.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="203.5113" x="30.06" y="566.4579"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.5113" x="40.06" y="591.4239">Single TX queue + RX parser</text></g><!--entity L7--><g class="entity" data-entity="L7" data-source-line="9" data-uid="ent0008" id="entity_L7"><rect fill="#F1F1F1" height="39.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="249.6411" x="7" y="665.5279"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="229.6411" x="17" y="690.4939">UART / USB CDC / TCP / WebSocket</text></g><g class="entity" data-entity="GMN15" data-source-line="19" data-uid="ent0016" id="entity_GMN15"><path d="M263.73,245.2079 L263.73,272.7679 L228.79,276.7679 L263.73,280.7679 L263.73,308.326 A0,0 0 0 0 263.73,308.326 L523.9172,308.326 A0,0 0 0 0 523.9172,308.326 L523.9172,255.2079 L513.9172,245.2079 L263.73,245.2079 A0,0 0 0 0 263.73,245.2079" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M513.9172,245.2079 L513.9172,255.2079 L523.9172,255.2079 L513.9172,245.2079" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.1872" x="269.73" y="264.1049">Each layer only knows the one below it,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.0432" x="269.73" y="281.8109">so a transport can be swapped without</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.1902" x="269.73" y="299.517">touching the handlers.</text></g><!--link L1 to L2--><g class="link" data-entity-1="L1" data-entity-2="L2" data-source-line="11" data-uid="lnk9" id="link_L1_L2"><path d="M131.82,86.3179 C131.82,103.3979 131.82,122.5179 131.82,139.6879" fill="none" id="L1-to-L2" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="131.82,145.6879,135.82,136.6879,131.82,140.6879,127.82,136.6879,131.82,145.6879" style="stroke:#181818;stroke-width:1;"/></g><!--link L2 to L3--><g class="link" data-entity-1="L2" data-entity-2="L3" data-source-line="12" data-uid="lnk10" id="link_L2_L3"><path d="M131.82,185.6779 C131.82,205.6979 131.82,231.0379 131.82,250.9779" fill="none" id="L2-to-L3" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="131.82,256.9779,135.82,247.9779,131.82,251.9779,127.82,247.9779,131.82,256.9779" style="stroke:#181818;stroke-width:1;"/></g><!--link L3 to L4--><g class="link" data-entity-1="L3" data-entity-2="L4" data-source-line="13" data-uid="lnk11" id="link_L3_L4"><path d="M131.82,296.7679 C131.82,316.7979 131.82,342.1379 131.82,362.0779" fill="none" id="L3-to-L4" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="131.82,368.0779,135.82,359.0779,131.82,363.0779,127.82,359.0779,131.82,368.0779" style="stroke:#181818;stroke-width:1;"/></g><!--link L4 to L5--><g class="link" data-entity-1="L4" data-entity-2="L5" data-source-line="14" data-uid="lnk12" id="link_L4_L5"><path d="M131.82,407.5779 C131.82,424.6579 131.82,443.7779 131.82,460.9379" fill=