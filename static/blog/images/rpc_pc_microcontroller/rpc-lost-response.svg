<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="345px" preserveAspectRatio="none" style="width:472px;height:345px;background:#FFFFFF;" version="1.1" viewBox="0 0 472 345" width="472px" zoomAndPan="magnify"><title>A timeout does not say whether the command ran</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="351.4407" x="60.2763" y="29.9659">A timeout does not say whether the command ran</text><g><title>PC</title><rect fill="#000000" fill-opacity="0.00000" height="228.2361" width="8" x="148.659" y="79.1358"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="152" x2="152" y1="79.1358" y2="307.3719"/></g><g><title>MCU</title><rect fill="#000000" fill-opacity="0.00000" height="228.2361" width="8" x="312.3701" y="79.1358"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="315.4802" x2="315.4802" y1="79.1358" y2="307.3719"/></g><g class="participant participant-head" data-participant="PC"><rect fill="#E2E2F0" height="33.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="31.3179" x="137" y="45.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="17.3179" x="144" y="67.0339">PC</text></g><g class="participant participant-tail" data-participant="PC"><rect fill="#E2E2F0" height="33.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="31.3179" x="137" y="306.3719"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="17.3179" x="144" y="328.3379">PC</text></g><g class="participant participant-head" data-participant="MCU"><rect fill="#E2E2F0" height="33.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="45.7799" x="293.4802" y="45.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="31.7799" x="300.4802" y="67.0339">MCU</text></g><g class="participant participant-tail" data-participant="MCU"><rect fill="#E2E2F0" height="33.0679" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="45.7799" x="293.4802" y="306.3719"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="31.7799" x="300.4802" y="328.3379">MCU</text></g><g class="message" data-participant-1="PC" data-participant-2="MCU"><polygon fill="#181818" points="304.3701,108.8419,314.3701,112.8419,304.3701,116.8419,308.3701,112.8419" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="152.659" x2="310.3701" y1="112.8419" y2="112.8419"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.7791" x="159.659" y="107.0328">request id = 42</text></g><g class="message" data-participant-1="MCU" data-participant-2="MCU"><line style="stroke:#181818;stroke-width:1;" x1="316.3701" x2="358.3701" y1="144.5479" y2="144.5479"/><line style="stroke:#181818;stroke-width:1;" x1="358.3701" x2="358.3701" y1="144.5479" y2="157.5479"/><line style="stroke:#181818;stroke-width:1;" x1="317.3701" x2="358.3701" y1="157.5479" y2="157.5479"/><polygon fill="#181818" points="327.3701,153.5479,317.3701,157.5479,327.3701,161.5479,323.3701,157.5479" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6231" x="323.3701" y="138.7389">executes the command</text></g><g class="message" data-participant-1="MCU" data-participant-2="PC"><line style="stroke:#181818;stroke-width:2;" x1="159.659" x2="169.659" y1="184.2539" y2="194.2539"/><line style="stroke:#181818;stroke-width:2;" x1="159.659" x2="169.659" y1="194.2539" y2="184.2539"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="164.659" x2="315.3701" y1="189.2539" y2="189.2539"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.7111" x="169.659" y="183.4449">response lost in transit</text></g><g class="message" data-participant-1="PC" data-participant-2="PC"><line style="stroke:#181818;stroke-width:1;" x1="152.659" x2="194.659" y1="220.9599" y2="220.9599"/><line style="stroke:#181818;stroke-width:1;" x1="194.659" x2="194.659" y1="220.9599" y2="233.9599"/><line style="stroke:#181818;stroke-width:1;" x1="153.659" x2="194.659" y1="233.9599" y2="233.9599"/><polygon fill="#181818" points="163.659,229.9599,153.659,233.9599,163.659,237.9599,159.659,233.9599" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.9921" x="159.659" y="215.1509">timeout expires</text></g><path d="M5,246.9599 L5,291.9599 L300,291.9599 L300,256.9599 L290,246.9599 L5,246.9599" fill="#FFDDDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M290,246.9599 L290,256.9599 L300,256.9599 L290,246.9599" fill="#FFDDDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.5602" x="11" y="265.8569">The PC only knows it heard nothing. Retrying</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.9202" x="11" y="283.5629">is safe only if the method is idempotent.</text><!--SRC=[LL11JiCm4Bpx5QFst1uGfqfKGa6zLOeGFC2AjsH5l3RsXYQ_PvC20X_irSnuPtUKTI0yGZbI6XKXKOKaHVKphZrfJmLseKinUWaeNfpBlYXtdBqeDcspWQzec__mkNbTSNkTQnliZak90mfzZ5GL7F20-pkteByaJTIDQZFyyRmfTiV9FDR_DIUfX24jNGHgCrNMRvDLyxCEJPbDxvojH4YVjepnszFfoOu3Nip5W2J3Z7T9rmfMzEHBM4BeMTxsU2OjirKcvsgvNEYcvyiwPBICKbWe3XIp-OZk7SdQWRu0]--></g></svg>